name: Mala Costumbre CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Lint
        run: npm run lint
        
      - name: Run Type Check
        run: npx tsc --noEmit